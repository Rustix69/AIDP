# Local development: one build, three stage containers, one shared storage volume.
#
#   docker compose up --build
#
# Scale a stage independently when a document backs up:
#   docker compose up --scale embed=3
#
# SKIP LOCKED means extra replicas of the same stage never collide.

x-worker: &worker
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    # Shared with the Next.js app, which writes uploads here under
    # STORAGE_BACKEND=local. Swapped for a bucket in deployment.
    - ../AIDP/.storage:/app/.storage
  environment:
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    STORAGE_LOCAL_PATH: /app/.storage
    APP_BASE_URL: ${APP_BASE_URL:-http://host.docker.internal:3000}
    WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-}

services:
  parse:
    <<: *worker
    environment:
      STAGE: parse
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /app/.storage
      APP_BASE_URL: ${APP_BASE_URL:-http://host.docker.internal:3000}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-}
      # Parsing holds a document in memory and calls a vision model per figure.
      LEASE_SECONDS: 900

  chunk:
    <<: *worker
    environment:
      STAGE: chunk
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /app/.storage
      APP_BASE_URL: ${APP_BASE_URL:-http://host.docker.internal:3000}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-}
      # One Claude call per chunk, run sequentially so the prompt cache is warm.
      LEASE_SECONDS: 1800

  embed:
    <<: *worker
    environment:
      STAGE: embed
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /app/.storage
      APP_BASE_URL: ${APP_BASE_URL:-http://host.docker.internal:3000}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-}
      LEASE_SECONDS: 600

  analyse:
    <<: *worker
    environment:
      STAGE: analyse
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /app/.storage
      APP_BASE_URL: ${APP_BASE_URL:-http://host.docker.internal:3000}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-}
      # A run is several model calls per clause — a hundred-odd clauses for
      # these documents, each read until two readings agree. Findings commit
      # one at a time, so a reap mid-run resumes rather than restarting, but a
      # lease this long keeps that from happening routinely.
      LEASE_SECONDS: 3600
      # The three knobs the analyse stage actually turns, surfaced here so they
      # can be set for one run without editing .env — which is what an A/B
      # against samples/MERIDIAN_ANSWER_KEY.md needs:
      #
      #   JUDGE_READINGS=1 ASSESS_CONCURRENCY=8 docker compose up -d analyse
      #
      # Unset means the default in config.py for the first two (3 readings, 8
      # at once).
      #
      # PREFER_WHOLE_DOCUMENT does NOT fall through to that default, and the
      # difference is money. Compose interpolates these from `Workers/.env`,
      # but only when it is run from `Workers/` — run it from anywhere else and
      # every one of them resolves empty. `${VAR:-}` would then hand the
      # container an empty string, config.py would read that as "no setting"
      # and fall back to its own default of *on*, and the run would read the
      # whole design into every single call: 11,134 input tokens a call across
      # 382 calls, 84% of a $2.03 run, with nothing anywhere saying it had
      # happened. See the note above this knob in `.env`.
      #
      # So the fallback here states the safe value rather than deferring. It
      # mirrors `.env` on purpose: the duplication is the point, because the
      # two are read under different conditions and only one of them survives
      # being run from the wrong directory.
      # The model the *verdicts* are reached with, which is worth separating
      # from the one that describes figures and reads a standard's rules: the
      # judge is the quality-critical call, and the clause set has to be held
      # constant to compare two judges against the answer key at all.
      # Defaults to the .env model, so leaving it alone changes nothing.
      OPENROUTER_MODEL: ${JUDGE_MODEL:-openai/gpt-4.1-mini}
      # Let the model's own findings of fact overturn a hedged verdict, rather
      # than taking the label it chose. Off here and off in config.py: it
      # changes what a verdict means, so it is turned on deliberately and
      # measured before it ships. See `scripts/judge_harness.py --procedure`.
      VERDICT_PROCEDURE: ${VERDICT_PROCEDURE:-off}
      JUDGE_READINGS: ${JUDGE_READINGS:-}
      ASSESS_CONCURRENCY: ${ASSESS_CONCURRENCY:-}
      PREFER_WHOLE_DOCUMENT: ${PREFER_WHOLE_DOCUMENT:-off}
